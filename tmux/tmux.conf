# ── Prefix ────────────────────────────────────────────────
# Remap prefix from Ctrl-b to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # press Ctrl-a twice to send a literal Ctrl-a

# ── General ───────────────────────────────────────────────
set -g mouse on               # mouse: select panes, resize, scroll
set -g history-limit 50000    # bigger scrollback buffer
set -sg escape-time 10        # snappier ESC handling (good for vim)
set -g focus-events on
set -g default-terminal "tmux-256color"

# ── Windows & panes ───────────────────────────────────────
set -g base-index 1           # windows start at 1
setw -g pane-base-index 1     # panes start at 1
set -g renumber-windows on    # renumber when a window closes

# Split panes with | and - (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in the current path
bind c new-window -c "#{pane_current_path}"

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ── Copy mode (vi keys) ───────────────────────────────────
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ── Status bar ────────────────────────────────────────────
set -g status-style "bg=colour234 fg=colour137"
set -g status-left "#[fg=colour232,bg=colour154,bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=colour245] %Y-%m-%d #[fg=colour255,bold]%H:%M "
set -g window-status-current-style "fg=colour232,bg=colour154,bold"
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
